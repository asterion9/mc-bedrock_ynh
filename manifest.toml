packaging_format = 2

id = "minecraft_bedrock"
name = "Minecraft Bedrock Server"
description.en = "Three-dimensional sandbox construction game"

version = "1.21.102.1~ynh1"

[upstream]
license = "GPL-3.0-only"

[install]
    [install.description]
    type = "markdown"
    ask.en = "This package installs a Minecraft Bedrock dedicated server."

    [install.info]
    type = "alert"
    ask.en = "No installation questions are required."

[integration]
yunohost = ">= 11.2"
architectures = ["amd64"]
multi_instance = false
ldap = false
sso = false

disk = "100M"
ram.build = "50M"
ram.runtime = "500M"

[resources]
    [resources.sources]
        [resources.sources.main]
        url = "https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-1.21.102.1.zip"
        sha256 = "87dc223a4bbdd15a0cc39d9b3630d4ae50e635898543a087ab8ef97cc0f9432e"
        in_subdir = false
        extract = true

    [resources.ports]
    main.default = 19132
    main.exposed = "UDP"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
